services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dealmile
      POSTGRES_PASSWORD: dealmile_local
      POSTGRES_DB: dealmile
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dealmile_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealmile"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dealmile_data:
